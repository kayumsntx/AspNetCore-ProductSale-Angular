<div class="container mt-2">

  <div class="row">
    <div class="col-md-6">
      <h3>Product Details</h3>
<form (ngSubmit)="saveProduct()">
      

  <div class="mb-2">
<label for="productName" class="form-label">Product Name</label>
<input type="text" id="productName" name="productName" class="form-control" [(ngModel)]="productObj.productName"/>
  </div>


  <div class="mb-2">
<label for="price" class="form-label">Price</label>
<input type="number" id="price" name="price" class="form-control" [(ngModel)]="productObj.price"/>
  </div>

  <div class="mb-2">
<label for="size" class="form-label">Size</label>
<input type="number" id="size" name="size" class="form-control" [(ngModel)]="productObj.size"/>
  </div>
  

   <div class="mb-2 form-check">

<input type="checkbox" id="onSale" name="onSale" class="form-check-input" [(ngModel)]="productObj.onSale"/>
<label for="onSale" class="form-labe">On Sale?</label>

  </div>

  
<div class="mb-3">
  <label class="form-label">Product Image</label>
          <input
            type="file"
            class="form-control"
            accept="image"
            (change)="onSelectedFile($event)"
          />
@if (imageUrl) {
            <img [src]="imageUrl" alt="productImg" class="img-thumbline" style="max-width: 200px" />
          }
        </div>
         <button type="submit" class="btn btn-success">Save Product</button>
  </form>
</div>
<div class="col-md-6">
  <h3>Product Sale</h3>
   <div class="mb-3">
        <label for="saleDate" class="form-label">Date</label>
        <input type="date" id="saleDate" class="form-control" [(ngModel)]="saleObj.date" />
   </div>
   <div class="mb-3">
        <label for="quantity" class="form-label">Quantity</label>
        <input type="number" id="quantity" class="form-control" [(ngModel)]="saleObj.quantity" />
   </div>
   <button type="button" class="btn btn-primary" (click)="addsales()">Add Sale</button>
   @if(saleList && saleList.length>0){
    <table class="table table-bordered">
      <thead>
        <tr>
          <th>Date</th>
          <th>Quantity</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        @for (sale of saleList; track $index) {
          <tr>
            <td>{{sale.date}}</td>
               <td>{{sale.quantity}}</td>
                  <td><button type="button" class="btn btn-danger" (click)="deleteSale(sale)">Remove</button></td>
          </tr>
        }
      </tbody>
    </table>
   }
   @else {
        <p class="text-muted text-center fst-italic">No sale transaction found</p>
     }
</div>
</div>
</div>
